<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20241a"/>
      <stop offset="100%" stop-color="#0d0f0a"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a4e600"/>
      <stop offset="55%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#4e7d00"/>
    </linearGradient>
  </defs>

  <!-- fond arrondi -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#76b900" stroke-width="6"/>

  <!-- oeil stylise -->
  <path d="M 40 128
           C 74 84, 110 70, 128 70
           C 146 70, 182 84, 216 128
           C 182 172, 146 186, 128 186
           C 110 186, 74 172, 40 128 Z"
        fill="url(#eye)"/>

  <!-- pupille -->
  <circle cx="128" cy="128" r="34" fill="#10130b"/>
  <!-- reflet -->
  <circle cx="116" cy="116" r="10" fill="#c9ff4d" opacity="0.85"/>

  <!-- encoche haute (clin d'oeil technique) -->
  <path d="M 128 70 L 128 96" stroke="#10130b" stroke-width="7" stroke-linecap="round"/>
</svg>
